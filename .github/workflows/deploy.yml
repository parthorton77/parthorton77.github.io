name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# deploy-pages needs id-token to prove the artifact came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vue-tsc typechecks, then vite compiles src/ into dist/ with hashed asset
      # filenames. This is the step that was missing: without it the raw
      # src/main.ts gets published and the browser refuses it as video/mp2t.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the built output only — never the project root.
      - name: Upload dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
